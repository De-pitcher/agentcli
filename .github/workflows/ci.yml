name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest -v --basetemp=.pytest-temp
      - run: pip-audit --local

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t agentcli .
      - name: Test Docker container
        run: |
          docker run --rm -e OPENROUTER_API_KEY=test agentcli --version
          docker run --rm -e OPENROUTER_API_KEY=test agentcli chat --model google/gemma-4-31b-it:free --no-stream <<< "hi"
      - name: Test Docker MCP
        run: |
          docker run --rm -i -e OPENROUTER_API_KEY=test agentcli mcp <<< '{"jsonrpc":"2.0","id":1,"method":"ping"}'

  hermetic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0"
      - run: pip install -e ".[dev]"
      - name: Run hermetic tests
        run: python -m pytest -q --basetemp=.pytest-temp -m "not integration and not live"
        env:
          HERMETIC_TESTS: "1"
          TERM: "dumb"

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t agentcli .
      - name: Test Docker container
        run: |
          docker run --rm -e OPENROUTER_API_KEY=test agentcli --version
          docker run --rm -e OPENROUTER_API_KEY=test agentcli chat --model google/gemma-4-31b-it:free --no-stream <<< "hi"
      - name: Test Docker MCP
        run: |
          docker run --rm -i -e OPENROUTER_API_KEY=test agentcli mcp <<< '{"jsonrpc":"2.0","id":1,"method":"ping"}'
